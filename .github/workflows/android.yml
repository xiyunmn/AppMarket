name: Android Release

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths-ignore:
      - "README.md"
      - "doc/**"

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare optional release signing
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEYSTORE_PASS: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SIGNING_KEY" ]]; then
            echo "No private signing key supplied; using the project's debug-signing fallback."
            exit 0
          fi
          if [[ -z "$KEYSTORE_PASS" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::A signing key was supplied but its password or alias is missing."
            exit 1
          fi
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/keystore.jks"
          chmod 600 "$RUNNER_TEMP/keystore.jks"
          {
            echo "KEYSTORE_PATH=$RUNNER_TEMP/keystore.jks"
            echo "KEYSTORE_PASS=$KEYSTORE_PASS"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build Release APK
        run: ./gradlew :app:android:assembleRelease --no-daemon --stacktrace

      - name: Verify APK and display hashes
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/android/build/outputs/apk/release -type f -name '*.apk')
          if [[ ${#apks[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one APK, found ${#apks[@]}."
            exit 1
          fi
          apk="${apks[0]}"
          apksigner="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          [[ -n "$apksigner" ]]
          "$apksigner" verify --verbose --print-certs "$apk"
          echo "APK_FILE=$apk" >> "$GITHUB_ENV"
          {
            echo "### Release APK"
            echo
            echo "File: $(basename "$apk")"
            echo
            echo "Commit: $GITHUB_SHA"
            echo
            if [[ -n "${KEYSTORE_PATH:-}" ]]; then
              echo "Signing: supplied release key."
            else
              echo "Signing: Android debug key (project fallback); no signing Secrets required."
            fi
            echo
            echo "| Hash Type | Hash Value |"
            echo "| --- | --- |"
            echo "| SHA256 | $(sha256sum "$apk" | awk '{ print $1 }') |"
            echo "| SHA1 | $(sha1sum "$apk" | awk '{ print $1 }') |"
            echo "| MD5 | $(md5sum "$apk" | awk '{ print $1 }') |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: AppMarket-release-${{ github.run_number }}
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
          retention-days: 30
          archive: false

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/keystore.jks"
