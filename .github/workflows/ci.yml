name: Android CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - "doc/**"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - "doc/**"

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Debug APK
        run: ./gradlew :app:android:assembleDebug --no-daemon --stacktrace

      - name: Verify APK and display hashes
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/android/build/outputs/apk/debug -type f -name '*.apk')
          if [[ ${#apks[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one APK, found ${#apks[@]}."
            exit 1
          fi
          apk="${apks[0]}"
          apksigner="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          [[ -n "$apksigner" ]]
          "$apksigner" verify --verbose --print-certs "$apk"
          echo "APK_FILE=$apk" >> "$GITHUB_ENV"
          {
            echo "### Debug APK"
            echo
            echo "File: `$(basename "$apk")`"
            echo
            echo "Commit: `$GITHUB_SHA`"
            echo
            echo "Signing: Android debug key; no signing Secrets required."
            echo
            echo "| Hash Type | Hash Value |"
            echo "| --- | --- |"
            echo "| SHA256 | `$(sha256sum "$apk" | awk '{ print $1 }')` |"
            echo "| SHA1 | `$(sha1sum "$apk" | awk '{ print $1 }')` |"
            echo "| MD5 | `$(md5sum "$apk" | awk '{ print $1 }')` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: AppMarket-debug-${{ github.run_number }}
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
          retention-days: 30
          archive: false
